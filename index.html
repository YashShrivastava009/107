Kyunki tumhara backend ab FastAPI par chal raha hai, humein pehle usko batana hoga ki PDF files ko frontend tak kaise bhejte hain, uske baad hum `index.html` mein ek premium PDF Viewer UI add karenge.

**Step 1: Backend (`main.py`) ko PDF serve karne ke liye update karo**
Apne GitHub mein `main.py` kholo aur is naye code se replace kar do. Isme maine ek naya `/pdf/{filename}` route add kiya hai jo tumhari PDFs ko securely dikhayega.

```python
import os
from fastapi import FastAPI, Request
from fastapi.middleware.cors import CORSMiddleware
from fastapi.responses import HTMLResponse, JSONResponse, FileResponse
import google.generativeai as genai

# Setup Gemini API Key
GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
genai.configure(api_key=GEMINI_API_KEY)

# Use standard, stable model name
MODEL_NAME = 'gemini-1.5-flash'
model = genai.GenerativeModel(MODEL_NAME)

app = FastAPI()

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

@app.get("/", response_class=HTMLResponse)
async def get_index():
    try:
        with open("index.html", "r", encoding="utf-8") as f:
            return f.read()
    except FileNotFoundError:
        return "<h1>Error: index.html not found in repository!</h1>"

# Naya route PDF files serve karne ke liye
@app.get("/pdf/{filename}")
async def get_pdf(filename: str):
    file_path = f"{filename}"
    if os.path.exists(file_path):
        return FileResponse(file_path, media_type="application/pdf")
    return JSONResponse(status_code=404, content={"message": "PDF document not found."})

@app.post("/chat")
async def chat_endpoint(request: Request):
    data = await request.json()
    user_message = data.get("message", "")
    
    system_instruction = (
        "You are the National BIS Assistant for SIH 2026, an official AI for Indian compliance. "
        "Keep answers professional, accurate, and format them beautifully using Markdown. "
        "If a user asks about standards (like cement, gold, toys), provide the relevant IS rules. "
        "Do not hallucinate fake laws."
    )
    
    try:
        full_prompt = f"{system_instruction}\n\nUser Query: {user_message}"
        response = model.generate_content(full_prompt)
        return JSONResponse({"reply": response.text})
    except Exception as e:
        return JSONResponse({"reply": f"**Backend Error:** {str(e)}"})
