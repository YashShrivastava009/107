<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIS AI - Copilot Theme</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            /* Exact gradient matching image_b75960.jpg */
            background: linear-gradient(165deg, #022a40 0%, #061c2e 30%, #161a24 60%, #4a2522 100%);
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center; overflow: hidden; color: #fff;
        }

        /* --- HOME SCREEN ELEMENTS (Titles, Cards) --- */
        #home-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            transition: opacity 0.4s ease, transform 0.5s ease;
        }
        #home-screen.hidden { opacity: 0; transform: translateY(-30px); pointer-events: none; }

        .greeting { margin-top: 15vh; text-align: center; }
        .greeting h1 { font-size: 28px; font-weight: 500; margin-bottom: 5px; }
        .greeting h2 { font-size: 32px; font-weight: 600; margin-bottom: 40px; }

        .suggestion-pills { display: flex; gap: 12px; margin-top: 25px; transition: opacity 0.4s; }
        .pill {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 18px; border-radius: 20px; font-size: 13px; color: #e2e4e9; cursor: pointer; transition: 0.2s;
        }
        .pill:hover { background: rgba(255, 255, 255, 0.15); }

        .bottom-widgets {
            position: absolute; bottom: 40px; display: flex; gap: 20px; width: 100%; max-width: 950px; justify-content: center;
        }
        .widget-card {
            background: rgba(30, 34, 43, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 20px;
            width: 300px; height: 160px; display: flex; flex-direction: column;
        }
        .widget-header { display: flex; justify-content: space-between; font-size: 11px; color: #a1a6b0; margin-bottom: 15px;}
        .widget-content { flex: 1; display: flex; align-items: center; gap: 15px; }
        .widget-icon { width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,0.1); }

        /* --- THE MAGIC INPUT BOX (Moves from middle to bottom) --- */
        #input-container {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 750px; background: rgba(30, 34, 43, 0.85);
            backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 15px 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); z-index: 100;
            /* The transition that makes it fly to the bottom */
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);

            /* Initial State (Middle) */
            top: 35vh;
        }

        /* State 2 (Bottom) applied via JS */
        #input-container.chat-mode { top: calc(100vh - 100px); width: 850px; border-radius: 30px;}

        .input-top-bar { display: flex; justify-content: space-between; font-size: 12px; color: #a1a6b0; margin-bottom: 10px; padding: 0 5px;}
        .model-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 12px; cursor: pointer;}
        .model-badge img { width: 14px; height: 14px; }

        .input-row { display: flex; align-items: center; gap: 10px; }
        input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 15px; font-family: 'Segoe UI', sans-serif; padding: 5px;}
        input::placeholder { color: #888; }

        .send-btn { background: rgba(255,255,255,0.1); border: none; width: 36px; height: 36px; border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .send-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05);}
        .send-btn svg { width: 16px; height: 16px; fill: currentColor; }

        /* --- CHAT AREA (Hidden initially, fades in) --- */
        #chat-area {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 850px; height: calc(100vh - 120px);
            padding: 40px 20px 20px 20px; overflow-y: auto; scroll-behavior: smooth;
            opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease 0.3s; /* Delays appearance until input moves */
            display: flex; flex-direction: column; gap: 24px;
        }
        #chat-area.active { opacity: 1; pointer-events: auto; }
        #chat-area::-webkit-scrollbar { width: 6px; }
        #chat-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes popIn { 0% { opacity: 0; transform: translateY(15px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .message-row { display: flex; gap: 15px; width: 100%; animation: popIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        .message-row.user { flex-direction: row-reverse; }

        .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .bot-avatar { background: linear-gradient(135deg, #10a37f, #00d4ff); }
        .user-avatar { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }

        .message { max-width: 80%; padding: 16px 20px; border-radius: 16px; font-size: 14px; line-height: 1.6; word-wrap: break-word; color: #e2e4e9;}
        .message h1, .message h2, .message h3 { margin-top: 5px; margin-bottom: 8px; color: #fff; font-size: 15px; }
        .message p { margin: 0 0 10px 0; }
        .message p:last-child { margin: 0; }

        .bot-message { background: rgba(30, 34, 43, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); }
        .user-message { background: rgba(45, 50, 62, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); }

        .typing-bubble { display: flex; align-items: center; gap: 6px; padding: 18px 20px !important; min-width: 70px; }
        .dot { width: 6px; height: 6px; background: #a1a6b0; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; box-shadow: 0 0 6px rgba(255,255,255,0.5); } }
    </style>
</head>
<body>

    <!-- STATE 1: THE HOME SCREEN (Matches Image Exactly) -->
    <div id="home-screen">
        <div class="greeting">
            <h1>Good afternoon</h1>
            <h2>What can I help you with today?</h2>
        </div>

        <div class="suggestion-pills">
            <button class="pill" onclick="sendPreset('Write a summary of BIS Mark')">Write a summary</button>
            <button class="pill" onclick="sendPreset('Get advice on MSME compliance')">Get advice</button>
            <button class="pill" onclick="sendPreset('Learn something new about ISI standards')">Learn something new</button>
            <button class="pill" onclick="sendPreset('Make a plan for factory testing')">Make a plan</button>
        </div>

        <div class="bottom-widgets">
            <div class="widget-card">
                <div class="widget-header"><span>🔗 Jump back in to your files</span><span>ⓘ</span></div>
                <div class="widget-content">
                    <div class="widget-icon" style="background: url('https://img.icons8.com/color/48/000000/pdf.png') center/cover;"></div>
                    <div style="font-size:13px;">BIS_Standards.pdf<br><span style="font-size:11px; color:#888;">2h ago</span></div>
                </div>
            </div>
            <div class="widget-card">
                <div class="widget-header"><span>👓 Get guided help with your apps</span><span>ⓘ</span></div>
                <div class="widget-content">
                    <div style="display:flex; gap:10px;">
                        <img src="https://img.icons8.com/color/48/000000/microsoft-word-2019--v2.png" width="24">
                        <img src="https://img.icons8.com/color/48/000000/microsoft-excel-2019--v1.png" width="24">
                        <img src="https://img.icons8.com/color/48/000000/microsoft-powerpoint-2019--v1.png" width="24">
                    </div>
                </div>
            </div>
            <div class="widget-card">
                <div class="widget-header"><span>💬 Keep talking to AI Engine</span></div>
                <div class="widget-content">
                    <div class="widget-icon" style="background: #2d323e; display:flex; align-items:center; justify-content:center; font-size:18px;">🏛️</div>
                    <div style="font-size:13px;">How can AI help me?<br><span style="font-size:11px; color:#888;">Just now</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- STATE 2: THE CHAT AREA (Hidden initially) -->
    <div id="chat-area">
        <!-- Messages will pop up here -->
    </div>

    <!-- THE MAGIC INPUT CONTAINER (Starts middle, moves to bottom) -->
    <div id="input-container">
        <div class="input-top-bar" id="input-top-bar">
            <span>Ask anything</span>
            <span class="model-badge">
                <span style="font-size:14px;">⚡</span> BIS AI Engine (Verified) ⌄
            </span>
            <span>+ 🎙️ 📸</span>
        </div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Type your query..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true });
        let isFirstMessage = true;

        // 👈 THE MAGIC TRANSITION FUNCTION
        function transitionToChatMode() {
            if (!isFirstMessage) return;
            isFirstMessage = false;

            // 1. Hide the Home Screen elements (Titles, Pills, Widgets)
            document.getElementById('home-screen').classList.add('hidden');

            // 2. Hide the "Ask anything" top bar inside the input for a cleaner look at bottom
            document.getElementById('input-top-bar').style.display = 'none';

            // 3. Move the input box to the bottom
            document.getElementById('input-container').classList.add('chat-mode');

            // 4. Show the Chat Area
            document.getElementById('chat-area').classList.add('active');
        }

        function showTypingIndicator() {
            const box = document.getElementById('chat-area');
            const row = document.createElement('div');
            row.id = 'typingBubble';
            row.className = `message-row bot`;
            row.innerHTML = `<div class="avatar bot-avatar">🏛️</div><div class="message bot-message typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            box.appendChild(row);
            box.scrollTop = box.scrollHeight;
        }

        function removeTypingIndicator() {
            const bubble = document.getElementById('typingBubble');
            if(bubble) bubble.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            // Trigger animation on first message!
            transitionToChatMode();

            appendMsg(text, 'user');
            input.value = '';
            showTypingIndicator();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();

                removeTypingIndicator();
                appendMsg(marked.parse(data.reply), 'bot');

            } catch(e) {
                removeTypingIndicator();
                appendMsg("Network error: Please make sure the Python Backend cell is running in Colab.", 'bot');
            }
        }

        function sendPreset(text) {
            document.getElementById('userInput').value = text;
            sendMessage(); // This will auto-trigger the transition
        }

        function appendMsg(content, sender) {
            const box = document.getElementById('chat-area');
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            row.innerHTML = `
                <div class="avatar ${sender}-avatar">${sender === 'bot' ? '🏛️' : '👤'}</div>
                <div class="message ${sender}-message">${content}</div>
            `;

            box.appendChild(row);
            box.scrollTop = box.scrollHeight;
        }

        function handleKey(e) { if(e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
